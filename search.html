<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Opportunities | ScholarStream</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        .search-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }
        .filter-sidebar {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            height: fit-content;
            position: sticky;
            top: 100px;
        }
        .filter-group {
            margin-bottom: 1.5rem;
        }
        .filter-group h4 {
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .filter-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .search-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .search-bar-large {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .search-bar-large input {
            flex-grow: 1;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 1.1rem;
        }
        
        /* Responsive */
        @media (max-width: 900px) {
            .search-layout {
                grid-template-columns: 1fr;
            }
            .filter-sidebar {
                position: static;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo" style="text-decoration: none; color: inherit;">ScholarStream</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="search.html" style="color: var(--accent);">Find Funding</a></li>
        </ul>
        <div class="nav-actions">
            <button class="btn-primary">Sign In</button>
        </div>
    </nav>

    <main class="container" style="padding-top: 100px;">
        <div class="search-header">
            <div>
                <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">Discover Opportunities</h1>
                <p style="color: var(--text-muted);">Search across our database of live grants and scholarships.</p>
            </div>
        </div>

        <div class="search-bar-large">
            <input type="text" id="advancedSearchInput" placeholder="e.g. 'Women in STEM', 'Federal Research Grant', 'Quantum Physics'">
            <button class="btn-primary" id="advancedSearchBtn" style="padding: 0 2rem; font-size: 1.1rem;">Search</button>
        </div>

        <div class="search-layout">
            <!-- Sidebar Filters -->
            <aside class="filter-sidebar">
                <div class="filter-group">
                    <h4>Opportunity Type</h4>
                    <label class="filter-label"><input type="checkbox" checked value="Grant" class="type-filter"> Grants</label>
                    <label class="filter-label"><input type="checkbox" checked value="Scholarship" class="type-filter"> Scholarships</label>
                    <label class="filter-label"><input type="checkbox" checked value="Fellowship" class="type-filter"> Fellowships</label>
                </div>
                
                <div class="filter-group">
                    <h4>Funding Amount</h4>
                    <label class="filter-label"><input type="radio" name="amount" checked value="all"> Any Amount</label>
                    <label class="filter-label"><input type="radio" name="amount" value="low"> Under $5,000</label>
                    <label class="filter-label"><input type="radio" name="amount" value="med"> $5,000 - $20,000</label>
                    <label class="filter-label"><input type="radio" name="amount" value="high"> Over $20,000</label>
                </div>

                <button class="btn-primary" id="applyFiltersBtn" style="width: 100%; margin-top: 1rem;">Apply Filters</button>
            </aside>

            <!-- Results Area -->
            <div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h3 id="resultCount" style="color: var(--text-muted); font-weight: normal;">Showing recommended opportunities...</h3>
                </div>
                <div class="scholarship-grid" id="advancedScholarshipGrid">
                    <!-- Results injected here -->
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="./search.js"></script>
</body>
</html>
